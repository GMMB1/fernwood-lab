# Edge proxy for the Fernwood lab. This is the ONLY container with a leg on a
# non-internal Docker network, so vulnerable services (SSRF!) cannot reach the
# host, the classroom LAN, or the internet.
worker_processes auto;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;

    # Re-resolve service names often: containers get new IPs when they are recreated,
    # and a cached IP would make the whole lab answer 502.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # "CDN" cache used by the Fernwood website (station B2).
    proxy_cache_path /var/cache/nginx/fw levels=1:2 keys_zone=fw:10m max_size=100m inactive=30m use_temp_path=off;

    # :8080 Fernwood website, behind a cache that caches static file extensions.
    server {
        listen 8080;
        set $portal portal:5000;

        # BUG (B2): cache anything that *looks* static, ignoring what the origin says.
        location ~* \.(css|js|png|jpe?g|gif|ico|svg|woff2?)$ {
            proxy_pass http://$portal;
            proxy_cache fw;
            proxy_cache_key "$scheme$request_uri";
            proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
            proxy_hide_header Set-Cookie;
            proxy_cache_valid 200 10m;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location / {
            proxy_pass http://$portal;
            add_header X-Cache-Status BYPASS always;
        }
    }

    server { listen 8081; set $u idp:5000;       location / { proxy_pass http://$u; } }        # Fernwood ID
    server { listen 8082; set $u linkcheck:5000; location / { proxy_pass http://$u; } }  # link checker
    server { listen 8083; set $u gateway:7000;   location / { proxy_pass http://$u; } }    # partner gateway (raw URI passed through)
    server { listen 9000; set $u attacker:9000;  location / { proxy_pass http://$u; } }   # attacker box
    server { listen 8088; set $u dashboard:5000; location / { proxy_pass http://$u; } }  # lab dashboard
}
